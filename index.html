<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - Les minéraux de Grasse</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <!-- -------------------------------- -->
    <!--Navigation-->
    <!-- ------------------------------ -->

    <nav>
        <a href="#" class="logo">E <span>SHOP</span></a>
        <ul class="navigation">
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#news">Nouveautés</a></li>
            <li><a href="#products">Produits</a></li>
            <li><a href="#reviews">Avis</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <div class="navigation-icones">
            <i id="user-icon" class='bx bxs-user'></i>
            <i id="search-icon" class='bx bx-search'></i>
            <i id="burger-menu" class="bx bx-menu"></i>
        </div>
        <!-- Search -->
        <div class="search-container">
            <input type="search" placeholder="Que recherchez-vous ?">
        </div>
        <!-- Compte -->
        <div class="user-container">
            <h2>Connectez-vous</h2>
            <input type="email" placeholder="E-mail">
            <input type="password" placeholder="Mot de passe">
            <input class="btn-user" type="submit" value="Connexion">
            <p>Mot de passe oublié ? <a href="#">Redefinir mot de passe</a></p>
            <p>Pas de compte ? <a href="#">Créer un compte !</a></p>
        </div>

    <!-- -------------------------------- -->
    <!--Home-->
    <!-- ------------------------------ -->

    <section id="home" class="home">
        <div class="home-content">
            <span>E-commerce</span>
            <h1>Tendance & Surprise</h1>
            <a href="#" class="btn">En savoir plus</a>
        </div>
        <div class="home-img">
            <img src="/images/accueil02.jpg" alt="image de l'accueil">
        </div>
    </section>

    <!-- -------------------------------- -->
    <!--News-->
    <!-- ------------------------------ -->

    <section id="news" class="news">

        <div class="section-heading">
            <h2>Nouvelle<span>Arrivage</span></h2>
        </div>
    </section>

    <!-- -------------------------------- -->
    <!--Produits-->
    <!-- ------------------------------ -->

    <!-- -------------------------------- -->
    <!--Avis-->
    <!-- ------------------------------ -->

    <!-- -------------------------------- -->
    <!--Contact-->
    <!-- ------------------------------ -->
    </nav>
    <script src="app.js"></script>
</body>
</html>
